# .github/workflows/security-scan.yml  - security scan on every pull request and on main.
# Starts report-only (SEC_PRESET=starter in .security/config.env). Change it to standard to block PRs: warden config set SEC_PRESET standard.
# No server needed. Results appear in GitHub itself: the run page (summary), the "Files changed" tab (markers on the risky lines) and ONE
# comment on the pull request that is updated on every push. If you later set SEC_DASHBOARD_URL, each scan is also sent to the dashboard.
name: security-scan
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write          # lets Warden post / update its ONE comment on the pull request (delete this line to turn comments off)
  # security-events: write      # only for the optional Security-tab upload at the bottom (see the note there)
jobs:
  scan:
    runs-on: ubuntu-latest        # or your self-hosted runner (it needs Docker)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Security scan
        run: .security/warden scan
        env:
          # Only needed if you turned on SonarQube (SEC_SONAR=1). Set in repo Settings > Secrets and variables.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          WARDEN_DASHBOARD_TOKEN: ${{ secrets.WARDEN_DASHBOARD_TOKEN }}   # optional: publishes the result to the central dashboard (URL: SEC_DASHBOARD_URL in config.env)
      - name: Show results in GitHub (run summary, file markers, pull request comment)
        if: always()
        run: .security/warden ci-report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WARDEN_PR_COMMENT: ${{ vars.WARDEN_PR_COMMENT }}      # set the repository variable to "off" to stop the pull request comment
      - name: Keep the report (HTML + markdown + SBOM + SARIF; NOT the raw tool output)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: security-report
          path: |
            .security/reports/20*/summary.html
            .security/reports/20*/summary.md
            .security/reports/20*/results.sarif
            .security/reports/20*/sbom.cdx.json
          retention-days: 14
      # Optional: also list findings in the GitHub "Security" tab (code scanning). Free for public repositories; private repositories need
      # GitHub Advanced Security. To turn it on: uncomment `security-events: write` above AND set the repository variable WARDEN_CODE_SCANNING=true.
      - name: Upload to code scanning
        if: always() && vars.WARDEN_CODE_SCANNING == 'true'
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f  # v3.28.18
        with:
          sarif_file: .security/reports/latest/results.sarif
