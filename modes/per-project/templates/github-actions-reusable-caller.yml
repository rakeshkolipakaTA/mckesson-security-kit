# Option B (central framework, no kit in your repo): .github/workflows/security.yml
# Your repo only needs this file (+ optionally .security/config.env and exceptions.json).
# The reusable workflow is pinned to a commit (a tag can be moved); update the SHA when a new release is announced (Dependabot's
# "github-actions" ecosystem does it for you).
name: security
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: write          # lets the scan post / update its ONE comment on the pull request
jobs:
  security:
    uses: rakeshkolipakaTA/mckesson-security-kit/.github/workflows/security-scan-reusable.yml@f4b787b422c54f5b8e1ffdeaef6b8079c8799040  # main at the time of writing; use a release SHA once one exists
    with:
      enforce: false          # flip to true when the team is ready to block PRs
      framework-ref: f4b787b422c54f5b8e1ffdeaef6b8079c8799040   # the same commit: the scanner scripts it checks out are pinned too
    secrets:                  # pass only what is needed (delete the ones you do not use)
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      WARDEN_DASHBOARD_TOKEN: ${{ secrets.WARDEN_DASHBOARD_TOKEN }}
