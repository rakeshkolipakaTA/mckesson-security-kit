# .security/ci/security-scorecard.github.yml - TEMPLATE, NOT RUN. OpenSSF Scorecard: scores the repository's own security practices
# (branch protection, pinned dependencies, signed releases, CI permissions, dependency-update tooling ...) and lists what to improve.
# Copy to .github/workflows/scorecard.yml. Results appear in the run's artifact and, with GitHub code scanning enabled, in the Security tab.
# publish_results is off: turn it on only for a PUBLIC repository if you want the public Scorecard badge.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '20 4 * * 2'
  push:
    branches: [main, master]
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # only needed when publish_results is true
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
      # Needs GitHub code scanning (free for public repos, Advanced Security for private). Remove if you do not have it.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
