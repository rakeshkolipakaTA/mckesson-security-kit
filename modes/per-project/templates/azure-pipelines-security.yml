# Azure DevOps: Pipelines > New pipeline > Existing Azure Pipelines YAML file > pick this file.
# Starts report-only (SEC_PRESET=starter in .security/config.env). Change it to standard to fail builds / block PRs
# (add this pipeline as a Build Validation policy on your main branch to make it a required PR check).
trigger:
  branches:
    include: [main, master]
pr:
  branches:
    include: ['*']
pool:
  vmImage: ubuntu-latest        # or your self-hosted agent pool (needs Docker)
steps:
  - checkout: self
  - script: .security/secscan scan
    displayName: Security scan
    # Only if you enabled SonarQube (SEC_SONAR=1): define SONAR_HOST_URL / SONAR_TOKEN (secret) in the pipeline variables, then uncomment:
    # env:
    #   SONAR_HOST_URL: $(SONAR_HOST_URL)
    #   SONAR_TOKEN: $(SONAR_TOKEN)
    #   SECSCAN_DASHBOARD_TOKEN: $(SECSCAN_DASHBOARD_TOKEN)   # optional: publish to the central dashboard (URL: SEC_DASHBOARD_URL in config.env)
  - script: |
      f=$(find .security/reports -maxdepth 2 -name summary.md | sort | tail -1)
      [ -n "$f" ] && echo "##vso[task.uploadsummary]$PWD/$f"
    displayName: Show summary on the run page
    condition: always()
  - task: PublishPipelineArtifact@1
    displayName: Keep the report
    condition: always()
    inputs:
      targetPath: .security/reports
      artifact: security-report
  # CD: before pushing an image, add:
  # - script: |
  #     docker build -t $(IMAGE) .
  #     .security/secscan gate --gate release --image $(IMAGE)
  #   displayName: Image security gate
