# .github/workflows/security-release.yml - the CD gate: scan code AND the built image BEFORE it is published/deployed.
# EDIT the three "EDIT:" lines. The strict "release" gate blocks on any Critical or High finding that is not in your approved exceptions.
name: security-release-gate
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: myapp:${{ github.sha }}          # EDIT: your image name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t "$IMAGE" .       # EDIT: build context / Dockerfile path if different
      - name: Release security gate (code + dependencies + image)
        run: .security/warden gate --gate release --image "$IMAGE"
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          WARDEN_DASHBOARD_TOKEN: ${{ secrets.WARDEN_DASHBOARD_TOKEN }}   # optional: publishes the result to the central dashboard (URL: SEC_DASHBOARD_URL in config.env)
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}   # optional: findings register (URL: SEC_DEFECTDOJO_URL in config.env). Only main/master runs publish. docs/integrations/defectdojo.md
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}   # optional: SBOM monitor (URL: SEC_DTRACK_URL in config.env). docs/integrations/dependency-track.md
      - name: Show results on the run page
        if: always()
        run: .security/warden ci-report --no-comment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: security-release-report
          path: |
            .security/reports/20*/summary.html
            .security/reports/20*/summary.md
            .security/reports/20*/sbom.cdx.json
      # Only reached when the gate above passed:
      - name: Push image
        run: echo 'EDIT - docker login, docker tag and docker push to JFrog / ACR go here'
