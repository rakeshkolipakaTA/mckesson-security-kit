# OPTIONAL deeper code analysis with GitHub CodeQL (data-flow SAST: follows user input to dangerous calls). Copy to .github/workflows/codeql.yml to enable.
# Warden's own Semgrep / Bandit / ESLint checks run without this. CodeQL adds depth, but results go to the repository's Security tab, which needs
# a PUBLIC repository (free) or GitHub Advanced Security on a private one. Without that, the upload step fails: leave this file disabled.
name: codeql
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1'      # weekly, Mondays 04:00 UTC
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write       # needed to publish results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]     # EDIT: python, javascript-typescript, java-kotlin, go, csharp, ruby, cpp, swift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f  # v3.28.18
        with:
          languages: ${{ matrix.language }}
          queries: security-extended     # security-and-quality adds code-quality rules
      - uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f  # v3.28.18
        with:
          category: "/language:${{ matrix.language }}"
