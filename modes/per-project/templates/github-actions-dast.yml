# .github/workflows/security-dast.yml - dynamic scan (OWASP ZAP) of your RUNNING QA/UAT app.
# NEVER point this at production. The runner must be able to reach the URL (QA behind a VPN needs a self-hosted runner).
# Set the repo variable QA_URL, e.g. https://myapp-qa.example.com
# Run it after your QA deployment job (add `needs: deploy-qa` or trigger manually / weekly as below).
name: security-dast
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'     # Mondays 03:00 UTC
permissions:
  contents: read
jobs:
  zap:
    runs-on: ubuntu-latest      # EDIT: self-hosted runner if QA is not public
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: ZAP baseline (passive, safe)
        env:
          QA_URL: ${{ vars.QA_URL }}
          # To scan BEHIND a login, set SEC_ZAP_AUTH (and the login URL) in .security/config.env, then uncomment what your login type needs.
          # Usernames, passwords and tokens are CI secrets, never files in the repo. Putting them in an "Environment" (add `environment: qa` to the job)
          # releases them only to this job. Login types, SSO and secret managers: docs/zap-authentication.md
          # ZAP_AUTH_USER: ${{ secrets.ZAP_AUTH_USER }}
          # ZAP_AUTH_PASSWORD: ${{ secrets.ZAP_AUTH_PASSWORD }}
          # ZAP_AUTH_TOKEN: ${{ secrets.ZAP_AUTH_TOKEN }}                  # a ready-made bearer token
          # ZAP_OAUTH_CLIENT_ID: ${{ secrets.ZAP_OAUTH_CLIENT_ID }}        # SSO (OpenID Connect / OAuth2) client
          # ZAP_OAUTH_CLIENT_SECRET: ${{ secrets.ZAP_OAUTH_CLIENT_SECRET }}
        run: .security/warden scan --zap-url "$QA_URL" --zap-mode baseline
        # For APIs, passive crawling finds little. Use an ACTIVE scan of specific URLs WITH parameters
        # (QA only, with the owners' approval):
        #   .security/warden scan --zap-mode full --zap-url "$QA_URL/search?q=test,$QA_URL/items/1"
      - name: Show results on the run page
        if: always()
        run: .security/warden ci-report --no-comment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: zap-report
          path: .security/reports/20*/summary.html
