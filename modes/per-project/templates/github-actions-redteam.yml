# .github/workflows/security-redteam.yml - AI red-team probes against your RUNNING agent in QA/UAT (AI agents only).
# These are REAL attack probes (injection, SSRF, tool misuse, rate-limit flood). QA/UAT only, never production, owner's approval first.
# Needs: repo variable QA_AGENT_URL, secrets REDTEAM_TOKEN (+ REDTEAM_TOKEN_B), and .security/redteam.json describing your API.
# The runner must be able to reach the agent URL (self-hosted runner if QA is private).
name: security-redteam
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 2'     # Tuesdays 02:00 UTC
permissions:
  contents: read
jobs:
  redteam:
    runs-on: ubuntu-latest      # EDIT: self-hosted runner if QA is not public
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Red-team probes
        run: .security/secscan redteam --redteam-url "${{ vars.QA_AGENT_URL }}" --redteam-contract .security/redteam.json
        env:
          REDTEAM_TOKEN: ${{ secrets.REDTEAM_TOKEN }}
          REDTEAM_TOKEN_B: ${{ secrets.REDTEAM_TOKEN_B }}
      - name: Show results on the run page
        if: always()
        run: |
          f=$(find .security/reports -maxdepth 2 -name summary.md 2>/dev/null | sort | tail -1)
          [ -n "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-report
          path: |
            .security/reports/20*/summary.html
            .security/reports/20*/summary.md
