# Reusable workflow (lives in the central repo mckesson-security-kit). Teams call it in ~10 lines:
#   see modes/per-project/templates/github-actions-reusable-caller.yml
# The repo path below points at rakeshkolipakaTA/mckesson-security-kit; change it if the kit moves to another organisation, and tag a release (v1).
name: security-scan (reusable)
on:
  workflow_call:
    inputs:
      enforce:        {type: boolean, default: false, description: "Fail the job on policy violations (false = report-only)"}
      gate:           {type: string,  default: pr,    description: "pr or release"}
      image:          {type: string,  default: "",    description: "Docker image already built in the calling job's runner to scan (optional)"}
      framework-ref:  {type: string,  default: v1,    description: "Tag/branch of the templates repo to use"}
    secrets:
      SONAR_TOKEN:    {required: false}
      WARDEN_DASHBOARD_TOKEN: {required: false, description: "Publishes the result to the central dashboard (URL comes from configs/central.env or config.env)"}
      DEFECTDOJO_TOKEN: {required: false, description: "Publishes findings to DefectDojo (URL: SEC_DEFECTDOJO_URL)"}
      DTRACK_API_KEY: {required: false, description: "Uploads the SBOM to Dependency-Track (URL: SEC_DTRACK_URL)"}
      NVD_API_KEY:    {required: false}
      FRAMEWORK_TOKEN: {required: false, description: "Token that can read the templates repo, only if it is private/internal"}
permissions:
  contents: read
  pull-requests: write          # for the single pull request comment; the calling workflow must grant it too
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the calling repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Checkout the security framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          repository: rakeshkolipakaTA/mckesson-security-kit
          ref: ${{ inputs.framework-ref }}
          path: .warden-framework
          token: ${{ secrets.FRAMEWORK_TOKEN || github.token }}
      - name: Move the framework out of the workspace (so it is not scanned as your code)
        run: mv .warden-framework "$RUNNER_TEMP/warden-framework"
      - name: Scan
        env:
          SEC_ENFORCE: ${{ inputs.enforce && '1' || '' }}
          SEC_GATE: ${{ inputs.gate }}
          SEC_IMAGE: ${{ inputs.image }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          WARDEN_DASHBOARD_TOKEN: ${{ secrets.WARDEN_DASHBOARD_TOKEN }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ${{ runner.temp }}/warden-framework/scripts/scan.sh "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/warden-report"
      - name: Show results in GitHub (run summary, file markers, pull request comment)
        if: always()
        run: python3 -I "$RUNNER_TEMP/warden-framework/scripts/gh_report.py" --report "$RUNNER_TEMP/warden-report" --root "$GITHUB_WORKSPACE"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WARDEN_PR_COMMENT: ${{ vars.WARDEN_PR_COMMENT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: security-report
          path: |
            ${{ runner.temp }}/warden-report/summary.html
            ${{ runner.temp }}/warden-report/summary.md
            ${{ runner.temp }}/warden-report/results.sarif
            ${{ runner.temp }}/warden-report/sbom.cdx.json
          retention-days: 14
