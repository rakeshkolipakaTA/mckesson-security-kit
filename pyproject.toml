[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-kit"
dynamic = ["version"]
description = "McKesson secure CI/CD scanning kit: one command to scan a repo (secrets, SAST, SCA, containers, AI-agent checks) and gate builds."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []          # the scanners run in pinned Docker images; nothing else is installed

[project.scripts]
warden = "warden_kit.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warden_kit = ["kit/**/*", "kit/*"]
