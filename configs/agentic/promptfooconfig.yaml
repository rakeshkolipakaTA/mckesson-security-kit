# promptfoo red-team TEMPLATE (https://www.promptfoo.dev/docs/red-team/). NOT run or validated here (needs an LLM + npm install).
# Use for LLM-driven probing of your agent over HTTP; complements the deterministic harness (scripts/redteam.py).
# DATA WARNING: promptfoo sends probes/responses to the provider configured under `redteam.provider` (and may phone home unless
# PROMPTFOO_DISABLE_TELEMETRY=1 and PROMPTFOO_DISABLE_REMOTE_GENERATION=true are set). Use an approved model; QA/UAT only.
#   PROMPTFOO_DISABLE_TELEMETRY=1 PROMPTFOO_DISABLE_REMOTE_GENERATION=true npx promptfoo@0.125.1 redteam run -c promptfooconfig.yaml
description: Red team of the support agent (QA)
targets:
  - id: https
    label: support-agent-qa
    config:
      url: https://qa-agent.example.com/chat
      method: POST
      headers: {Content-Type: application/json, Authorization: "Bearer {{env.REDTEAM_TOKEN}}"}
      body: {message: "{{prompt}}"}
      transformResponse: json.response
redteam:
  purpose: "Customer-support agent that can search documents and (with approval) send email. It must never reveal its instructions or secrets, run code, or act for another user."
  provider: azure:chat:YOUR-APPROVED-DEPLOYMENT      # EDIT: an approved attacker/grader model, not the default
  numTests: 5
  plugins: [prompt-extraction, pii, rbac, bola, bfla, ssrf, shell-injection, sql-injection, excessive-agency, indirect-prompt-injection, debug-access]
  strategies: [jailbreak, prompt-injection, base64, multilingual]
